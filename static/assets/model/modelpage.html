<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="navbar">

    <a href="/" class="logo">
        <img src="/static/assets/logo.svg" alt="BolsoBet">
        <span class="logo-text">BolsoBet</span>
    </a>

    <div class="navbar-right">

        <button class="icon-btn" id="sound-btn">🔊</button>

        {% if "usuario_id" in session %}

        <div class="user-buttons">

            <form action="/deposito" method="GET">
                <button class="btn saldo-btn">
                    💰 R$ {{ "%.2f"|format(session["saldo"]) }}
                </button>
            </form>

            <button class="btn perfil-btn">
                👤 {{ session["nome"] }}
            </button>

            <a href="/logout" class="btn btn-login">
                Sair
            </a>

        </div>

        {% else %}

        <div class="guest-buttons">

            <a href="/login" class="btn btn-login">
                Entrar
            </a>

            <a href="/register" class="btn btn-register">
                Cadastrar
            </a>

        </div>

        {% endif %}

    </div>

    </header>



    <div class="esclarecimento">
        <label>
            Nós da BolsoBet afirmamos que nós não temos nenhuma relação com o politico "Jair Messias Bolsonaro" ou qualquer um de seus familiares,
            o nome BolsoBet vem da palavra "bolso" e sua relação metaforica com questões monetarias.
        </label>
        <div class="lateral">
            <a class="anexo" href="/termos">
                termos do site
            </a>
            <a class="anexo" href="/static/assets/model/jogos.zip">
                Código Base dos jogos
            </a>
        </div>
    </div>

</body>

</html>
