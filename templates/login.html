<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <script>
                alert("{{ messages[0] }}");
            </script>
        {% endif %}
    {% endwith %}

    <header class="navbar">

    <a href="/" class="logo">
        <img src="/static/assets/logo.svg" alt="BolsoBet">
        <span class="logo-text">BolsoBet</span>
    </a>

    </header>

    <main class="login-page">

        <div class="login-box">

            <h1>Entrar</h1>
            <p>Acesse sua conta para continuar.</p>

            <form action="/entrar" method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button class="btn btn-login">
                    Entrar
                </button>

            </form>

            <span>
                Não possui uma conta?
                <a href="/register">Cadastre-se</a>
            </span>

        </div>

    </main>

    <div class="esclarecimento">
            <a class="anexo" href="/termos">
                termos do site
            </a>
    </div>

</body>

</html>
