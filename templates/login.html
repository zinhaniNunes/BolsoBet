<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="navbar">

    <a href="home.html" class="logo">
        <img src="/assets/logo.svg" alt="BolsoBet">
        <span class="logo-text">BolsoBet</span>
    </a>

    <div class="navbar-right">

        <button class="icon-btn" id="sound-btn" title="Som">
            🔊
        </button>

        <!-- Mostrar quando NÃO estiver logado -->
        <div class="guest-buttons">

            <a href="/templates/login.html" class="btn btn-login">
                Entrar
            </a>

            <a href="/templates/register.html" class="btn btn-register">
                Cadastrar
            </a>

        </div>

        <!-- Mostrar quando estiver logado -->
        <div class="user-buttons" style="display: none;">

            <button class="btn saldo-btn">
                💰
            </button>

            <button class="btn perfil-btn">
                👤
            </button>

        </div>

    </div>

    </header>

    <main class="login-page">

        <div class="login-box">

            <h1>Entrar</h1>
            <p>Acesse sua conta para continuar.</p>

            <form action="/py/login.py" method="POST">

                <input type="email" placeholder="Email">

                <input type="password" placeholder="Senha">

                <button class="btn btn-login">
                    Entrar
                </button>

            </form>

            <span>
                Não possui uma conta?
                <a href="register.html">Cadastre-se</a>
            </span>

        </div>

    </main>

    <div class="esclarecimento">
        <label>
            Nós da BolsoBet afirmamos que nós não temos nenhuma relação com o politico "Jair Messias Bolsonaro" ou qualquer um de seus familiares,
            o nome BolsoBet vem da palavra "bolso" e sua relação metaforica com questões monetarias.
        </label>
        <div class="lateral">
            <a class="anexo" href="termos.html">
                termos do site
            </a>
            <a class="anexo" href="assets/model/jogos.zip">
                Código Base dos jogos
            </a>
        </div>
    </div>

</body>

</html>
