<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body alt="background error" style="background-image: url('/static/assets/imgs/fundo_egito.png'); background-size: cover; background-position: center; background-repeat: no-repeat;">


    <main class="container-lateral">

            <!-- Máquina -->
                <div id="matriz" data-simbolos="🏺,🐫,🪲,🌞,🪙,🐱">

                    {% for i in range(4) %}
                    <div class="linha">
                        {% for j in range(3) %}
                        <span>🐱</span>
                        {% endfor %}
                    </div>
                    {% endfor %}

                </div>

            <div class="slot-machine-lateral">

            <div class="mascote-container">
                <img id="mascote-img"
                     src="/static/assets/imgs/egito(neutro).png"
                     data-img-pequeno="/static/assets/imgs/egito(pequeno).png"
                     data-img-medio="/static/assets/imgs/egito(medio).png"
                     data-img-grande="/static/assets/imgs/egito(grande).png"
                     alt="egito" class="mascote-image">
            </div>

                <div class="controles">
                    <!-- Informações -->
                        <div class="info-jogo">

                            <p>
                                🎰 saldo restantes:
                                R$ <span class="saldo">{{ "%.2f"|format(session["saldo"])|replace(".", ",") }}</span>
                                🎰
                            </p>

                            <p id="mensagem"></p>

                        </div><!-- Controles -->
                        <input class="campo" id="aposta" type="number" min="0.40" step="0.10" placeholder="Aposta (R$) minimo R$0,40">
                        <input class="campo"id="comprar_spins" type="number" min="1" placeholder="Comprar Spins">
                        <button id="girar">GIRAR</button>
                        </div>
                </div>        
            </div>
    </main>

<script src="{{ url_for('static', filename='slot.js') }}"></script>

</body>

</html>
