<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body alt="background error" style="background-color: #044b10; background-size: cover; background-position: center; background-repeat: no-repeat;">


    <main class="container-lateral">
                        <!-- mesa -->
                <div id="matriz" class="mesa">

                    <!-- div onde aparece as cartas-->

                </div>

            <div class="slot-machine-lateral">
                

            <div class="21-bnt">
                <!-- botões comprar e parar q começan cinza e dps ficam verde e vermelhor respectivamente-->
            </div>

                <div class="controles">
                    <!-- Informações -->
                        <div class="info-jogo">

                            <p>
                                💰 saldo restantes:
                                R$ <span class="saldo">{{ "%.2f"|format(session["saldo"])|replace(".", ",") }}</span>
                                💰
                            </p>

                            <p id="mensagem"></p>

                        </div><!-- Controles -->
                        <input class="campo" id="aposta" type="number" min="0.40" step="0.10" placeholder="Aposta (R$) minimo R$0,40">
                        <button id="COMEÇAR">COMEÇAR</button>
                        </div>
                </div>        
            </div>
    </main>

<script src="{{ url_for('static', filename='campo-minado.js') }}"></script>

</body>

</html>
