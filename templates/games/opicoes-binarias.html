<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body alt="background error" style="background-color: #182437; background-size: cover; background-position: center; background-repeat: no-repeat;">


    <main class="container-lateral">
                        <!-- mesa -->
                <div>
                    <div class="chart-header">
                        <label for="moeda-select" class="chart-header-label">Ativo</label>
                        <select id="moeda-select" class="select-moeda"></select>
                    </div>
                    <div id="matriz" style="width: 800px;height: 600px;">

                    </div>
                </div>
                <div class="slot-machine" style="display: flex; flex-direction: column;">
                    
                        <div class="controles">
                            <!-- Informações -->
                                <div class="info-jogo">

                                    <p>
                                        O gráfico vai subir ou descer?
                                    </p>

                                    <p id="mensagem"></p>

                                </div><!-- Controles -->
                                    <button id="SUBIR" style="background: #3f8b0b;">SUBIR</button>
                                    <button id="DESCER" style="background: #970909;">DESCER</button>
                        </div>
                    
                        <div class="controles">
                            <!-- Informações -->
                                <div class="info-jogo">

                                    <p>
                                        saldo restantes:
                                        R$ <span class="saldo" id="saldo-valor">{{ "%.2f"|format(session["saldo"])|replace(".", ",") }}</span>
                                    </p>

                                </div><!-- Controles -->
                                
                                    <input class="campo" id="aposta" type="number" min="0.40" step="0.10" placeholder="Aposta (R$) minimo R$0,40">
                                    <button id="COMEÇAR">COMEÇAR</button>
                        </div>
                </div>        
            </div>
    </main>

<script src="{{ url_for('static', filename='opicoes-binarias.js') }}"></script>

</body>

</html>
