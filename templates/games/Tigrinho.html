<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
    <script>

    const simbolos = [
        "🍒","🍊","🪙","🧧","🪭",
        "🥁","👑","💎","⭐","🐯"
    ];

    function emojiAleatorio(){
        return simbolos[Math.floor(Math.random() * simbolos.length)];
    }

    const casas = document.querySelectorAll(".linha span");

    function embaralhar(){
        casas.forEach(casa=>{
            casa.textContent = emojiAleatorio();
        });
    }

    setInterval(embaralhar, 100);

    </script>
</head>

<body>

    <header class="navbar">

    <a href="/" class="logo">
        <img src="/static/assets/logo.svg" alt="BolsoBet">
        <span class="logo-text">BolsoBet</span>
    </a>

    <div class="navbar-right">

        <button class="icon-btn" id="sound-btn">🔊</button>

        <div class="user-buttons">

            <form action="/deposito" method="GET">
                <button class="btn saldo-btn">
                    💰 R$ {{ "%.2f"|format(session["saldo"]) }}
                </button>
            </form>

            <button class="btn perfil-btn">
                👤 {{ session["nome"] }}
            </button>

            <a href="/logout" class="btn btn-login">
                Sair
            </a>

        </div>

    </div>

    </header>

    <main>
        {% if "usuario_id" in session %}
                <div class="slot-machine">

                    <div id="matriz">

                        <div class="linha">
                            <span>❔</span><span>❔</span><span>❔</span><span>❔</span><span>❔</span>
                        </div>

                        <div class="linha">
                            <span>❔</span><span>❔</span><span>❔</span><span>❔</span><span>❔</span>
                        </div>

                        <div class="linha">
                            <span>❔</span><span>❔</span><span>❔</span><span>❔</span><span>❔</span>
                        </div>

                        <div class="linha">
                            <span>❔</span><span>❔</span><span>❔</span><span>❔</span><span>❔</span>
                        </div>

                        <div class="linha">
                            <span>❔</span><span>❔</span><span>❔</span><span>❔</span><span>❔</span>
                        </div>

                    </div>

                    <br>

                    <input
                        id="aposta"
                        type="number"
                        value="1"
                        min="0.4"
                        step="0.1">

                    <button id="girar">
                        GIRAR
                    </button>

                </div>
        {% else %}
            <script>
                location.replace("/login");
            </script>
        {% endif %}


    </main>

</body>

</html>
