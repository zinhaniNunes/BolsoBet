<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>BolsoBet</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <script>
                alert("{{ messages[0] }}");
            </script>
        {% endif %}
    {% endwith %}

    <header class="navbar">

    <a href="/" class="logo">
        <img src="/static/assets/logo.svg" alt="BolsoBet">
        <span class="logo-text">BolsoBet</span>
    </a>

    <div class="navbar-right">

        <button class="icon-btn" id="sound-btn" title="Som">
            🔊
        </button>


        <div class="guest-buttons">

            <a href="/login" class="btn btn-login">
                Entrar
            </a>

            <a href="/register" class="btn btn-register">
                Cadastrar
            </a>

        </div>

        <div class="user-buttons" style="display: none;">

            <button class="btn saldo-btn">
                💰
            </button>

            <button class="btn perfil-btn">
                👤
            </button>

        </div>

    </div>

    </header>

    <main class="login-page">

        <div class="login-box">

            <h1>Criar Conta</h1>
            <p>Cadastre-se gratuitamente.</p>

            <form action="/cadastrar" method="POST">

                <input type="text" name="usuario" placeholder="Nome" required>

                <input type="email" name="email" placeholder="Email" required>

                <input type="password" name="senha" placeholder="Senha" required>

                <input type="password" name="confirmar_senha" placeholder="Confirmar senha" required>

                <button class="btn btn-register">
                    Criar Conta
                </button>

            </form>

            <span>
                Já possui uma conta?
                <a href="/login">Entrar</a>
            </span>

        </div>

    </main>

    <div class="esclarecimento">
        <label>
            Nós da BolsoBet afirmamos que nós não temos nenhuma relação com o politico "Jair Messias Bolsonaro" ou qualquer um de seus familiares,
            o nome BolsoBet vem da palavra "bolso" e sua relação metaforica com questões monetarias.
        </label>
        <div class="lateral">
            <a class="anexo" href="/termos">
                termos do site
            </a>
            <a class="anexo" href="/static/assets/model/jogos.zip">
                Código Base dos jogos
            </a>
        </div>
    </div>

</body>

</html>
